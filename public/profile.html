<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Edushelf</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>

<body class="bg-background min-h-screen">
    <div class="hidden lg:fixed lg:inset-y-0 lg:flex lg:w-64 lg:flex-col">
        <div class="flex min-h-0 flex-1 flex-col bg-primary">
            <div class="flex h-16 flex-shrink-0 items-center px-4">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-book-open text-primary text-lg"></i>
                    </div>
                    <h1 class="text-white text-lg font-semibold">AutoLib Ecosystem</h1>
                </div>
            </div>
            <nav class="mt-5 flex-1 space-y-1 px-2">
                <a href="dashboard.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-chart-line mr-3 text-primary-200 group-hover:text-white"></i> Dashboard
                </a>
                <a href="book.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-book mr-3 text-primary-200 group-hover:text-white"></i> Books
                </a>
                <a href="profile.html"
                    class="bg-primary-600 text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                    <i class="fas fa-user-circle mr-3 text-white"></i> Profile
                </a>
                <!-- <a href="verification.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-shield-alt mr-3 text-primary-200 group-hover:text-white"></i>
                    Verification
                </a> -->
                <a href="index.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-sign-out-alt mr-3 text-primary-200 group-hover:text-white"></i> Logout
                </a>
            </nav>
        </div>
    </div>

    <div class="lg:hidden">
        <div
            class="flex items-center justify-between bg-primary px-4 py-3 border-b border-primary-600 sticky top-0 z-20">
            <div class="flex items-center">
                <h1 class="text-white text-lg font-semibold tracking-wide">My Profile</h1>
            </div>
        </div>
    </div>

    <div class="lg:pl-64">
        <main class="flex-1 pb-24 lg:pb-8">
            <div class="px-4 sm:px-6 lg:px-8 py-6 sm:py-8 max-w-3xl mx-auto">

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                    <div class="px-4 sm:px-6 py-4 border-b border-gray-200 bg-gray-50">
                        <h2 class="text-lg font-semibold text-gray-800"><i
                                class="fas fa-user-edit text-primary mr-2"></i>Personal Details</h2>
                    </div>
                    <div class="p-4 sm:p-6">
                        <form id="profileForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                <input type="text" id="profName" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address <span
                                        class="text-xs text-gray-400">(Cannot be changed)</span></label>
                                <input type="email" id="profEmail" disabled
                                    class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Enrollment
                                        Number</label>
                                    <input type="text" id="profEnrollment" required
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Semester</label>
                                    <input type="text" id="profSem"
                                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                                <input type="text" id="profDept"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                            </div>

                            <div class="pt-4 flex justify-end">
                                <button type="submit" id="saveProfileBtn"
                                    class="bg-primary hover:bg-primary-600 text-white px-6 py-2 rounded-lg font-medium shadow-sm transition-colors w-full sm:w-auto">
                                    Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="px-4 sm:px-6 py-4 border-b border-gray-200 bg-gray-50">
                        <h2 class="text-lg font-semibold text-gray-800"><i
                                class="fas fa-lock text-gray-500 mr-2"></i>Security</h2>
                    </div>
                    <div class="p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between">
                        <div class="mb-4 sm:mb-0">
                            <h3 class="font-medium text-gray-900">Change Password</h3>
                            <p class="text-sm text-gray-500">We will send a secure password reset link to your email.
                            </p>
                        </div>
                        <button id="resetPasswordBtn"
                            class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg font-medium shadow-sm transition-colors w-full sm:w-auto">
                            Send Reset Link
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div
        class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-1 z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center h-14">
            <a href="dashboard.html"
                class="flex flex-col items-center justify-center w-full h-full text-gray-400 active:bg-gray-50">
                <i class="fas fa-chart-line text-lg mb-1"></i><span class="text-[10px] font-medium">Dashboard</span>
            </a>
            <a href="book.html"
                class="flex flex-col items-center justify-center w-full h-full text-gray-400 active:bg-gray-50">
                <i class="fas fa-book text-lg mb-1"></i><span class="text-[10px] font-medium">BOOKS</span>
            </a>
            <a href="profile.html"
                class="flex flex-col items-center justify-center w-full h-full text-primary active:bg-gray-50">
                <i class="fas fa-user-circle text-lg mb-1"></i><span class="text-[10px] font-medium">PROFILE</span>
            </a>
        </div>
    </div>

    <script type="module" src="profile.js"></script>
</body>

</html>
