<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLib Admin Console</title>
  <link rel="stylesheet" href="styles.css">
  <link class="favicon" rel="icon" href="data:,">
</head>

<body>
  <div class="container">

    <div class="form-container" id="login-form">
      <h2>ADMIN LOGIN</h2>

      <div id="login-error" class="error-message"></div>

      <form id="loginForm">
        <label for="loginEmail">Admin Email</label>
        <div class="form-group">
          <span class="icon">📧</span>
          <input type="email" id="loginEmail" placeholder="admin@example.com" required>
        </div>

        <label for="loginPassword">Password</label>
        <div class="form-group">
          <span class="icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
          <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
        </div>
        <div class="options">
          <a href="#" onclick="showResetPassword(event)">Forgot password?</a>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <div class="form-container" id="resetPassword" style="display: none;">
      <form id="resetForm">
        <h2>Reset Admin Password</h2>

        <label for="email">Email</label>
        <div class="form-group">
          <span class="icon">📧</span>
          <input type="email" id="email" placeholder="Enter admin email" required />
        </div>

        <button type="submit" class="btn">Send Reset Email</button>

        <div id="message" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>

        <div class="options" style="margin-top: 15px; text-align: center;">
          <a href="#" onclick="showLoginForm(event)">Back to login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="app.js?v=2"></script>
  <script>
    // Toggle Password Visibility
    window.togglePasswordVisibility = function (inputId, iconElement) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        iconElement.textContent = "🙈";
      } else {
        input.type = "password";
        iconElement.textContent = "👁️";
      }
    };

    function showResetPassword(event) {
      if (event) event.preventDefault();
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('resetPassword').style.display = 'block';
    }

    function showLoginForm(event) {
      if (event) event.preventDefault();
      document.getElementById('resetPassword').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      const msg = document.getElementById('message');
      if (msg) msg.textContent = '';
    }
  </script>
</body>

</html>
