<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script type="module" src="firebase-config.js"></script>
    <link rel="stylesheet" href="main.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body class="bg-background min-h-screen">
    <div class="hidden lg:fixed lg:inset-y-0 lg:flex lg:w-64 lg:flex-col">
        <div class="flex min-h-0 flex-1 flex-col bg-primary">
            <div class="flex h-16 flex-shrink-0 items-center px-4">
                <div class="flex items-center">
                    <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-book-open text-primary text-lg"></i>
                    </div>
                    <h1 class="text-white text-lg font-semibold">AutoLib Ecosystem</h1>
                </div>
            </div>
            <nav class="mt-5 flex-1 space-y-1 px-2">
                <a href="admin-dashboard.html"
                    class="bg-primary-600 text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                    <i class="fas fa-chart-line mr-3 text-white"></i> Dashboard
                </a>
                <a href="book.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-book mr-3 text-primary-200 group-hover:text-white"></i> Books
                </a>
                <!-- <a href="profile.html"
                    class="student-only text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-user-circle mr-3 text-primary-200 group-hover:text-white"></i>
                    Profile
                </a>
                <a href="verification.html"
                    class="student-only text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-shield-alt mr-3 text-primary-200 group-hover:text-white"></i>
                    Verification
                </a> -->
                <a href="index.html"
                    class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                    <i class="fas fa-sign-out-alt text-xl mr-3 text-primary-200 group-hover:text-white"></i> LOGOUT
                </a>
            </nav>
        </div>
    </div>
    <!-- Mobile Navigation -->
    <div class="lg:hidden">
        <!-- Mobile Header -->
        <div class="flex items-center justify-between bg-primary px-4 py-3">
            <div class="flex items-center">
                <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center mr-3">
                    <i class="fas fa-book-open text-primary text-lg"></i>
                </div>
                <h1 class="text-white text-lg font-semibold">AutoLib</h1>
            </div>
            <button id="mobileMenuBtn" class="text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>

        <!-- Mobile Menu Overlay -->
        <div id="mobileMenu" class="fixed inset-0 z-50 hidden">
            <div class="fixed inset-0 bg-black bg-opacity-50" id="mobileMenuOverlay"></div>
            <div class="fixed inset-y-0 left-0 w-64 bg-primary transform -translate-x-full transition-transform duration-300"
                id="mobileMenuPanel">
                <div class="flex items-center justify-between p-4 border-b border-primary-600">
                    <h2 class="text-white text-lg font-semibold">Menu</h2>
                    <button id="closeMobileMenu" class="text-white">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <nav class="mt-5 space-y-1 px-2">
                    <a href="admin-dashboard.html"
                        class="bg-primary-600 text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <i class="fas fa-chart-line mr-3"></i>
                        DASHBOARD
                    </a>
                    <a href="book.html"
                        class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                        <i class="fas fa-book mr-3"></i>
                        BOOKS
                    </a>
                    <a href="index.html"
                        class="text-primary-100 hover:bg-primary-600 hover:text-white group flex items-center px-2 py-2 text-sm font-medium rounded-md transition-colors">
                        <i class="fas fa-sign-out-alt text-xl"></i>
                        LOGOUT
                    </a>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="lg:pl-64">
        <div class="flex flex-col">
            <header class="bg-white shadow-sm border-b border-gray-200">
                <div class="px-4 sm:px-6 lg:px-8">
                    <div class="flex h-16 items-center justify-between">
                        <div class="flex items-center">
                            <h1 class="text-2xl font-semibold text-gray-900">WELCOME</h1>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button id="openScannerBtn"
                                class="p-2 text-gray-400 hover:text-gray-500 transition-colors relative">
                                <i class="fas fa-qrcode mr-2"></i> Scan QR
                            </button>

                            <button class="p-2 text-gray-400 hover:text-gray-500 transition-colors relative">
                                <i class="fas fa-bell text-xl"></i>
                        </div>
                    </div>
            </header>
            <!-- Dashboard Content -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-bold text-blue-500 uppercase tracking-wide">Total Books</p>
                                <p id="totalBooksCount" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                            </div>
                            <div class="p-3 bg-blue-50 rounded-lg"><i class="fas fa-book text-blue-600 text-xl"></i>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-bold text-orange-500 uppercase tracking-wide">Borrowed</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="totalBorrowedCount">0</p>
                            </div>
                            <div class="p-3 bg-orange-50 rounded-lg"><i
                                    class="fas fa-hand-holding text-orange-600 text-xl"></i></div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-xs font-bold text-red-500 uppercase tracking-wide">Overdue</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="overdueCount">0</p>
                            </div>
                            <div class="p-3 bg-red-50 rounded-lg"><i
                                    class="fas fa-exclamation-circle text-red-600 text-xl"></i></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 space-y-3 sm:space-y-0">
                    <h2 class="text-lg font-semibold text-gray-800">System Logs & Management</h2>
                    <div class="flex space-x-3 w-full sm:w-auto">
                        <button id="btnManualTrans"
                            class="flex-1 sm:flex-none bg-primary hover:bg-primary-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                            <i class="fas fa-handshake mr-2"></i> Manual Issue/Return
                        </button>
                        <button id="btnExportCSV"
                            class="flex-1 sm:flex-none bg-secondary hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                            <i class="fas fa-file-csv mr-2"></i> Export to CSV
                        </button>
                    </div>
                </div>
                <div id="whitelistControls"
                    class="hidden mb-6 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">

                        <div class="relative w-full md:w-1/2">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                                <i class="fas fa-search text-gray-400"></i>
                            </span>
                            <input type="text" id="whitelistSearch"
                                placeholder="Search by name or 12-digit enrollment..."
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                        </div>

                        <div class="flex w-full md:w-auto gap-3">
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden">

                            <button onclick="document.getElementById('csvFileInput').click()"
                                class="flex-1 md:flex-none px-4 py-2 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 rounded-lg font-bold text-sm transition-colors shadow-sm whitespace-nowrap">
                                <i class="fas fa-file-csv mr-2"></i>Upload CSV
                            </button>

                            <button onclick="openManualAddModal()"
                                class="flex-1 md:flex-none px-4 py-2 bg-primary text-white hover:bg-primary-600 rounded-lg font-bold text-sm transition-colors shadow-sm whitespace-nowrap">
                                <i class="fas fa-user-plus mr-2"></i>Add Single
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="border-b border-gray-200 flex flex-wrap bg-gray-50">
                        <button id="tabToday"
                            class="px-6 py-4 text-sm font-medium text-blue-600 border-b-2 border-blue-600 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-clock mr-2"></i>Today's Gate</button>
                        <button id="tabHistory"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-history mr-2"></i>Gate History</button>
                        <button id="tabBooks"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-exchange-alt mr-2"></i>Transactions</button>
                        <button id="tabWaitlists"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-list-ol mr-2"></i>Waitlists</button>
                        <button id="tabInventory"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-boxes mr-2"></i>Inventory</button>
                        <button id="tabStudents"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none"><i
                                class="fas fa-users mr-2"></i>Students</button>
                        <button id="tabWhitelist"
                            class="px-6 py-4 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition-colors focus:outline-none">
                            <i class="fas fa-list-check mr-2"></i>Approved Students
                        </button>
                    </div>

                    <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
                        <table class="min-w-full divide-y divide-gray-200" id="mainDataTable">
                            <thead class="bg-gray-50 sticky top-0 shadow-sm" id="dynamicTableHeaders">
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="logsTableBody">
                                <tr>
                                    <td colspan="8" class="px-6 py-10 text-center text-gray-500"><i
                                            class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="manualTransModal" class="fixed inset-0 z-50 hidden">
        <div class="fixed inset-0 bg-black bg-opacity-50" id="manualTransOverlay"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl z-10 max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between mb-4 border-b pb-3">
                    <h3 class="text-lg font-bold text-gray-900"><i class="fas fa-handshake text-primary mr-2"></i>Manual
                        Transaction</h3>
                    <button id="closeManualTrans" class="text-gray-400 hover:text-gray-600"><i
                            class="fas fa-times"></i></button>
                </div>
                <form id="manualTransForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Student Enrollment No. (or
                            Email)</label>
                        <input type="text" id="manualEnrollment" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary"
                            placeholder="e.g. 123456789">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Book ISBN</label>

                        <div class="flex space-x-2">
                            <input type="text" id="manualISBN" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary"
                                placeholder="e.g. 978123456789">
                            <button type="button" id="startManualScanBtn"
                                class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg border border-gray-300 transition-colors font-semibold"
                                title="Scan Barcode">
                                <i class="fas fa-barcode"></i> Scan
                            </button>
                        </div>

                        <div id="manualScannerBox"
                            class="hidden mt-3 w-full overflow-hidden rounded-lg border border-gray-300 bg-black">
                            <div id="manualScannerContainer" class="w-full h-48"></div>
                            <button type="button" id="stopManualScanBtn"
                                class="w-full py-2 bg-red-50 text-red-600 font-bold text-sm hover:bg-red-100 transition-colors">Cancel
                                Camera</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Action</label>
                        <select id="manualAction"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                            <option value="issue">Issue Book (Borrow)</option>
                            <option value="return">Return Book</option>
                        </select>
                    </div>
                    <button type="submit"
                        class="w-full py-3 bg-primary hover:bg-primary-600 text-white font-bold rounded-lg shadow-sm transition-colors mt-4">
                        Confirm Transaction
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div id="scannerModal" class="fixed inset-0 z-50 hidden">
        <div class="fixed inset-0 bg-black bg-opacity-50" id="scannerModalOverlay"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4 z-10">
            <div class="bg-white rounded-xl p-6 max-w-lg w-full flex flex-col">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">QR Check-In / Check-Out</h3>
                    <button id="closeScannerModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <div id="reader"
                    class="w-full overflow-hidden rounded-lg border-2 border-dashed border-gray-300 bg-black"></div>
                <div id="scanMessage" class="mt-4 p-3 rounded-lg text-sm font-medium hidden text-center"></div>
            </div>
        </div>
        <div id="editBookModal" class="fixed inset-0 z-50 hidden">
            <div class="fixed inset-0 bg-black bg-opacity-50" id="editBookOverlay"></div>
            <div class="fixed inset-0 flex items-center justify-center p-4">
                <div class="bg-white rounded-xl p-6 max-w-lg w-full z-10">
                    <div class="flex justify-between mb-4 border-b pb-3">
                        <h3 class="text-lg font-bold text-gray-900">Edit Inventory</h3>
                        <button id="closeEditBook" class="text-gray-400 hover:text-gray-600"><i
                                class="fas fa-times"></i></button>
                    </div>
                    <form id="editBookForm" class="space-y-4">
                        <input type="hidden" id="editIsbnHidden">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                            <input type="text" id="editTitle" required class="w-full px-3 py-2 border rounded-lg">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Total Quantity</label>
                                <input type="number" id="editQuantity" min="1" required
                                    class="w-full px-3 py-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Available Now</label>
                                <input type="number" id="editAvailable" min="0" required
                                    class="w-full px-3 py-2 border rounded-lg bg-gray-50">
                            </div>
                        </div>
                        <button type="submit"
                            class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-lg mt-2">Update
                            Book</button>
                    </form>
                </div>
            </div>
        </div>

        <script type="module" src="admin-dashboard.js"></script>

</body>

</html>
